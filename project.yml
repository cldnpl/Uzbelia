name: Uzbelia
options:
  bundleIdPrefix: com.uzbelia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "1600"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Automatic signing, so the app can be installed on a real iPhone.
    # Leave DEVELOPMENT_TEAM empty and pick your team once in Xcode:
    # target Uzbelia > Signing & Capabilities > Team.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
targets:
  Uzbelia:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.uzbelia.app
        PRODUCT_NAME: Uzbelia
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Uzbelia"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Uzbelia usa il microfono per gli esercizi di pronuncia. / Uzbelia talaffuz mashqlari uchun mikrofondan foydalanadi."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Uzbelia usa il riconoscimento vocale per valutare la tua pronuncia. / Uzbelia talaffuzingizni baholash uchun nutqni tanishdan foydalanadi."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  UzbeliaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: Uzbelia
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uzbelia.app.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Uzbelia.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Uzbelia"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Uzbelia:
    build:
      targets:
        Uzbelia: all
        UzbeliaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UzbeliaTests
