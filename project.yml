name: Uzbelia
options:
  bundleIdPrefix: com.uzbelia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "1600"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Automatic signing, so the app can be installed on a real iPhone.
    # This is the paid team: it is what gives the installed app a provisioning
    # profile good for a year, instead of the seven days a free Apple ID grants.
    # To build under a different account, change it here (or in Xcode:
    # target Uzbelia > Signing & Capabilities > Team) and run `xcodegen generate`.
    DEVELOPMENT_TEAM: "H4M7KJL5DT"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
targets:
  Uzbelia:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "Uzbelia.entitlements"
    # XcodeGen *genera* questo file a ogni `xcodegen generate`, e lo genera con
    # dentro esattamente quel che dicono le `properties` qui sotto — niente altro.
    # Scrivere la capability a mano nel file non serviva a niente: la rigenerazione
    # successiva la cancellava, l'app veniva firmata senza, e il pulsante Apple
    # moriva con l'errore 1000 anche su un iPhone dove l'ID Apple c'era eccome.
    #
    # Con la riga qui sotto la capability sopravvive, Xcode la alza sull'App ID del
    # team da solo (firma automatica) e il profilo che ne esce sa firmarla.
    entitlements:
      path: Resources/Uzbelia.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    dependencies:
      # On-device Uzbek speech recognition. Both this and the model in
      # Resources/Models are build artefacts kept out of git: rebuild them with
      # ./scripts/build-uzbek-recognizer.sh (it takes a few minutes and ~1 GB of
      # downloads). Without them the app still builds — the recogniser simply
      # reports itself unavailable and the old fallbacks take over.
      - framework: Frameworks/whisper.xcframework
        embed: true
        codeSign: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.uzbelia.app
        PRODUCT_NAME: Uzbelia
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Uzbelia"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Uzbelia usa il microfono per gli esercizi di pronuncia. / Uzbelia talaffuz mashqlari uchun mikrofondan foydalanadi."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Uzbelia usa il riconoscimento vocale per valutare la tua pronuncia. / Uzbelia talaffuzingizni baholash uchun nutqni tanishdan foydalanadi."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  UzbeliaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: Uzbelia
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uzbelia.app.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Uzbelia.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Uzbelia"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Uzbelia:
    build:
      targets:
        Uzbelia: all
        UzbeliaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UzbeliaTests
